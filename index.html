<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Manga Reader</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #000;
        color: #fff;
        font-family: sans-serif;
        overflow: hidden;
      }

      .reader {
        width: 100vw;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
      }

      img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        user-select: none;
        -webkit-user-drag: none;
        transition: opacity 0.25s ease;
      }

      img.loading {
        opacity: 0;
      }

      .nav {
        position: absolute;
        top: 0;
        width: 25%;
        height: 100%;
        z-index: 10;
        cursor: pointer;
        opacity: 1;
        visibility: visible;
        transition:
          opacity 0.2s ease,
          visibility 0.2s ease;
      }

      .nav.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .prev {
        left: 0;
      }

      .next {
        right: 0;
      }

      .arrow {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        font-size: 60px;
        color: white;
        background: rgba(0, 0, 0, 0.5);
        width: 70px;
        height: 70px;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        user-select: none;
        transition: all 0.25s ease;
        opacity: 0.8;
        backdrop-filter: blur(8px);
      }

      .toggle-arrows {
        position: fixed;
        top: 18px;
        right: 18px;
        z-index: 30;
        border: none;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
        padding: 10px 16px;
        font-size: 14px;
        cursor: pointer;
        backdrop-filter: blur(8px);
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
        transition:
          background 0.2s ease,
          transform 0.2s ease;
      }

      .toggle-arrows:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      .toggle-arrows:active {
        transform: scale(0.98);
      }

      .nav:hover .arrow {
        opacity: 1;
        transform: translateY(-50%) scale(1.1);
        background: rgba(255, 255, 255, 0.15);
      }

      .prev .arrow {
        left: 20px;
      }

      .next .arrow {
        right: 20px;
      }

      .info {
        position: fixed;
        bottom: 15px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.7);
        padding: 8px 16px;
        border-radius: 999px;
        font-size: 14px;
      }

      .nav:active .arrow {
        transform: translateY(-50%) scale(0.9);
      }
    </style>
  </head>
  <body>
    <button class="toggle-arrows" id="toggleArrowsBtn" type="button">
      Ẩn mũi tên
    </button>

    <div class="reader">
      <div class="nav prev" id="prevNav" onclick="previousPage()">
        <div class="arrow">❮</div>
      </div>

      <img id="pageImage" />

      <div class="nav next" id="nextNav" onclick="nextPage()">
        <div class="arrow">❯</div>
      </div>
    </div>

    <div class="info" id="pageInfo"></div>

    <script>
      const START = 944;
      const END = 4232;

      let currentPage = parseInt(localStorage.getItem("currentPage")) || START;
      let arrowsVisible = localStorage.getItem("arrowsVisible") !== "false";

      const image = document.getElementById("pageImage");
      const info = document.getElementById("pageInfo");
      const prevNav = document.getElementById("prevNav");
      const nextNav = document.getElementById("nextNav");
      const toggleArrowsBtn = document.getElementById("toggleArrowsBtn");

      function formatNumber(num) {
        return String(num).padStart(5, "0");
      }

      function loadPage() {
        image.classList.add("loading");

        const newSrc = `images/img_${formatNumber(currentPage)}.webp`;

        const temp = new Image();

        temp.onload = () => {
          image.src = newSrc;

          requestAnimationFrame(() => {
            image.classList.remove("loading");
          });
        };

        temp.src = newSrc;

        info.textContent = `${currentPage - START + 1} / ${END - START + 1}`;

        localStorage.setItem("currentPage", currentPage);
      }

      function updateArrowVisibility() {
        prevNav.classList.toggle("hidden", !arrowsVisible);
        nextNav.classList.toggle("hidden", !arrowsVisible);
        toggleArrowsBtn.textContent = arrowsVisible
          ? "Ẩn mũi tên"
          : "Hiện mũi tên";
        localStorage.setItem("arrowsVisible", String(arrowsVisible));
      }

      function toggleArrows() {
        arrowsVisible = !arrowsVisible;
        updateArrowVisibility();
      }

      function nextPage() {
        if (currentPage < END) {
          currentPage++;

          loadPage();
        }
      }

      function previousPage() {
        if (currentPage > START) {
          currentPage--;

          loadPage();
        }
      }

      toggleArrowsBtn.addEventListener("click", toggleArrows);

      document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight") nextPage();

        if (e.key === "ArrowLeft") previousPage();
      });

      let touchStartX = 0;

      document.addEventListener("touchstart", (e) => {
        touchStartX = e.changedTouches[0].screenX;
      });

      document.addEventListener("touchend", (e) => {
        const touchEndX = e.changedTouches[0].screenX;

        const diff = touchStartX - touchEndX;

        if (diff > 50) nextPage();

        if (diff < -50) previousPage();
      });

      updateArrowVisibility();
      loadPage();
    </script>
  </body>
</html>
